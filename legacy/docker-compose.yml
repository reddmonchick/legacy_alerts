services:
  db:
    image: postgres:16-alpine
    container_name: ff_calendar_postgres
    environment:
      POSTGRES_USER: ff_bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ff_calendar
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ff_bot -d ff_calendar"]
      interval: 5s
      timeout: 5s
      retries: 5

  ff-calendar-bot:
    build: .
    container_name: ff_calendar_discord_bot
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
