name: keepalive-render

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "$KEEPALIVE_URL")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "Health check failed"
            exit 1
          fi
        env:
          KEEPALIVE_URL: ${{ vars.KEEPALIVE_URL }}
